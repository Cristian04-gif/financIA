spring:
  #Configuración de R2DBC para MySQL
  r2dbc:
    url: r2dbc:postgresql://${HOST_DB}:${PORT_BD}/${NAME_DB}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 10

  # Configuración del servidor WebFlux
  http:
    codecs:
      max-in-memory-size: 10MB
  cloud:
    config:
      enabled: false

  ai:
    google:
      genai:
        api-key: ${API_KEY_GEMINI}
        chat:
          # model: gemini-3.5-flash-lite
          temperature: 0.7

app:
  ai:
    models-cascade:
      - gemini-3.1-flash-lite
      - gemini-3.5-flash-lite
      - gemini-3.5-flash
      - gemini-3.6-flash
      - gemini-3.7-flash
      - gemini-3.8-flash

url:
  frontend: ${HOST_FRONTEND}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
