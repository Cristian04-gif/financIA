version: '3.1'

services:

  spring-boot:
    build: ./
    container_name: financia-api
    mem_reservation: 512M
    environment:
      PROFILE: prod
      HOST_DB: postgres
      PORT_BD: 5432
      NAME_DB: financia
      DB_USERNAME: postgres
      DB_PASSWORD: password
      HOST_FRONTEND: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    container_name: financiaDB
    environment:
      POSTGRES_DB: financia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d financia" ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
